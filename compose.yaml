# SIESAL 4.0 — Docker Compose próprio (isolado do TI-REX). Projeto: siesal.
# Nada de container_name, network_mode host, privileged ou docker.sock.
name: siesal

services:
  # Banco: PostgreSQL 18.6, sem porta publicada no host
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?preencha POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?preencha POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?preencha POSTGRES_PASSWORD no .env}
    volumes:
      # PostgreSQL 18 grava em /var/lib/postgresql/18/docker: montar a pasta-mãe
      - pgdata:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 768m
    cpus: 1.0

  # API: Fastify. /saude sempre; rotas /auth/* só com AUTH_SECRET preenchido. Publicada apenas em 127.0.0.1
  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORTA:-3000}:3000"
    environment:
      DATABASE_URL: postgres://siesal_app:${SIESAL_APP_PASSWORD:-}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET:-}
      # Só demonstração em http (localhost/IP/porta): cookie sem Secure. Em produção use https e "nao".
      AUTH_MODO_LOCAL: ${AUTH_MODO_LOCAL:-nao}
      # Atrás do nginx, a API lê o IP real do cabeçalho X-Forwarded-For
      TRUST_PROXY: ${TRUST_PROXY:-sim}
      INSTITUICAO_PADRAO_ID: ${INSTITUICAO_PADRAO_ID:-}
    networks: [web, backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Site: nginx serve o React e repassa /api para a API. Único ponto de entrada para o navegador.
  # Local: http://localhost:8080. Na rede: defina WEB_BIND=0.0.0.0 e acesse http://IP-DO-COMPUTADOR:8080.
  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORTA:-8080}:8080"
    networks: [web]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.25

  # Proxy de entrada (Funnel/túnel): repassa ao site e, no horário configurado, mostra só a página de manutenção.
  # Local: http://127.0.0.1:18081. Variáveis: MANUTENCAO_MODO (auto, ligada, liberada) e MANUTENCAO_JANELA (HH:MM-HH:MM, America/Sao_Paulo).
  proxy:
    build: ./proxy
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    ports:
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_PORTA:-18081}:8081"
    environment:
      MANUTENCAO_MODO: ${MANUTENCAO_MODO:-auto}
      MANUTENCAO_JANELA: ${MANUTENCAO_JANELA-06:00-23:59}
    networks: [web]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/proxy-saude"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Migração: job único, só roda com --profile release. Aplica as migrações SQL como administrador
  # do banco e cria os papéis siesal_owner e siesal_app. Exige backup confirmado (CONFIRMA_BACKUP=sim).
  migrate:
    build: ./api
    profiles: [release]
    command: ["node", "dist/migrar/executar.js"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL_ADMIN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SIESAL_APP_PASSWORD: ${SIESAL_APP_PASSWORD:-}
      CONFIRMA_BACKUP: ${CONFIRMA_BACKUP:-nao}
    networks: [backend]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # Instalação dos 2 Masters: cria as vagas pendentes, sem senha. Só com --profile release e uma vez.
  bootstrap:
    build: ./api
    profiles: [release]
    command: ["node", "dist/migrar/executar-bootstrap.js"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL_ADMIN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MASTER_1_USUARIO: ${MASTER_1_USUARIO:-}
      MASTER_2_USUARIO: ${MASTER_2_USUARIO:-}
    networks: [backend]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # Convite de primeiro acesso de um Master (L18): imprime o convite uma vez; vale 30 minutos e uma vez.
  # Uso: MASTER_USUARIO=nome docker compose --profile release run --rm convite-master
  convite-master:
    build: ./api
    profiles: [release]
    command: ["node", "dist/migrar/executar-convite-master.js"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL_ADMIN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MASTER_USUARIO: ${MASTER_USUARIO:-}
    networks: [backend]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # Cria uma instituição fictícia e o primeiro administrador (senha provisória impressa uma vez).
  instituicao:
    build: ./api
    profiles: [release]
    command: ["node", "dist/migrar/executar-instituicao.js"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL_ADMIN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      INSTITUICAO_NOME: ${INSTITUICAO_NOME:-Instituição Demonstração}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador Demonstração}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@exemplo.invalid}
    networks: [backend]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # Aluno fictício para teste local (perfil release). Exige ALUNO_TESTE_CONFIRMA=sim e INSTITUICAO_ID.
  aluno-teste:
    build: ./api
    profiles: [release]
    command: ["node", "dist/migrar/executar-aluno-teste.js"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL_ADMIN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ALUNO_TESTE_CONFIRMA: ${ALUNO_TESTE_CONFIRMA:-nao}
      INSTITUICAO_ID: ${INSTITUICAO_PADRAO_ID:-}
      ALUNO_NOME: ${ALUNO_NOME:-Aluno Demonstração}
      ALUNO_EMAIL: ${ALUNO_EMAIL:-aluno@exemplo.invalid}
    networks: [backend]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # Testes de integração (suíte de isolamento): cria e apaga um banco temporário. Só com --profile teste.
  teste:
    build:
      context: ./api
      target: teste
    profiles: [teste]
    depends_on:
      db:
        condition: service_healthy
    environment:
      TESTE_URL_ADMIN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/postgres
      SIESAL_APP_PASSWORD: ${SIESAL_APP_PASSWORD:-}
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

networks:
  web: {}
  # Rede interna: sem acesso à internet nem ao host
  backend:
    internal: true

volumes:
  pgdata: {}
