# SIESAL 4.0 — Docker Compose próprio (isolado do TI-REX). Projeto: siesal.
# Nada de container_name, network_mode host, privileged ou docker.sock.
name: siesal

services:
  # Banco: PostgreSQL 18.6, sem porta publicada no host
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?preencha POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?preencha POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?preencha POSTGRES_PASSWORD no .env}
    volumes:
      # PostgreSQL 18 grava em /var/lib/postgresql/18/docker: montar a pasta-mãe
      - pgdata:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 768m
    cpus: 1.0

  # API: Fastify; só /saude por enquanto. Publicada apenas em 127.0.0.1
  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORTA:-3000}:3000"
    networks: [web, backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Migração: job único, só roda com --profile release. Vazio no Lote 1.
  migrate:
    build: ./api
    profiles: [release]
    command: ["node", "-e", "console.log('migrate: nenhuma migração neste lote')"]
    networks: [backend]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

networks:
  web: {}
  # Rede interna: sem acesso à internet nem ao host
  backend:
    internal: true

volumes:
  pgdata: {}
