# Proxy na frente de web (e, por ele, da api). Em manutenção responde 503 com a página fixa,
# para qualquer caminho e método, sem repassar nada ao site nem à API.
server {
  listen 8081;
  server_name _;
  server_tokens off;

  # Saúde do próprio proxy (funciona também em manutenção)
  location = /proxy-saude {
    default_type text/plain;
    return 200 "ok";
  }

  # Estilo da página de manutenção (arquivo próprio, sem estilo embutido por causa da CSP)
  location = /manutencao.css {
    root /usr/share/manutencao;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    # O vigia cria este arquivo quando chega o horário de manutenção
    set $manutencao 0;
    if (-f /tmp/manutencao) { set $manutencao 1; }
    if ($manutencao) { return 503; }

    proxy_pass http://web:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 1m;
  }

  # error_page para uma URL troca o método por GET, então POST e demais também recebem a página
  error_page 503 /_manutencao.html;

  location = /_manutencao.html {
    internal;
    alias /usr/share/manutencao/index.html;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
  }
}
