# Cabeçalhos de segurança. Incluído no nível do server e em cada location que usa add_header,
# porque add_header dentro de location substitui os do nível acima (AUD-02).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# L17d (A-037): liberado só o necessário para o VLibras (conferido no navegador, versão 7.12.2; os arquivos de vlibras.gov.br/app redirecionam para cdn.jsdelivr.net/gh/spbgovbr-vlibras/). Ver docs/PLANO-L17D.md.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://vlibras.gov.br https://cdn.jsdelivr.net/gh/spbgovbr-vlibras/; style-src 'self' 'unsafe-inline' https://vlibras.gov.br https://cdn.jsdelivr.net/gh/spbgovbr-vlibras/; img-src 'self' data: https://vlibras.gov.br https://cdn.jsdelivr.net/gh/spbgovbr-vlibras/; font-src 'self' https://vlibras.gov.br https://cdn.jsdelivr.net/gh/spbgovbr-vlibras/; connect-src 'self' https://vlibras.gov.br https://traducao2.vlibras.gov.br https://cdn.jsdelivr.net/gh/spbgovbr-vlibras/; frame-src https://vlibras.gov.br; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
